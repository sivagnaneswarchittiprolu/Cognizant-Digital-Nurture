<!-- 10.Debugging with Chrome DevTools
Scenario: A few users report layout issues and script errors.
Objective: Use Chrome DevTools and VS Code features to debug.
Task:
• Use “Inspect Element” to modify styles and experiment live
• Use the Console tab to view logs from your <script>
• Add breakpoints in JS and reload the page to watch variable values -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debugging Example</title>

    <style>

        body {
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            color: green;
            font-size: 20px;
        }

    </style>
</head>
<body>

    <h2>Debugging Practice</h2>

    <input
        type="number"
        id="num1"
        placeholder="Enter first number"
    >

    <br><br>

    <input
        type="number"
        id="num2"
        placeholder="Enter second number"
    >

    <br><br>

    <button onclick="calculateSum()">
        Calculate Sum
    </button>

    <p id="result"></p>

    <script>

        function calculateSum() {

            console.log("Function Started");

            let n1 =
                document.getElementById("num1").value;

            let n2 =
                document.getElementById("num2").value;

            console.log("Number 1:", n1);
            console.log("Number 2:", n2);

            let sum =
                Number(n1) + Number(n2);

            console.log("Sum:", sum);

            document.getElementById("result")
                .innerHTML =
                "Sum = " + sum;

        }

    </script>

</body>
</html>
