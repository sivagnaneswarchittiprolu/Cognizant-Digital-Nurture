<!-- 7. Video Invite with Media Events
Scenario: Show a short event promo video.
Objective: Work with <video> and oncanplay event
Task:
• Insert a <video> element with source and controls
• Use oncanplay to display a message like "Video ready to play"
• Use onbeforeunload to warn users if they try to leave the form page unfinished -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Invite</title>

    <style>

        body {
            font-family: Arial;
            text-align: center;
            padding: 20px;
        }

        video {
            width: 500px;
            border: 4px solid blue;
            border-radius: 10px;
        }

        #message {
            color: green;
            font-weight: bold;
            margin-top: 10px;
        }

        textarea {
            width: 400px;
            height: 100px;
            margin-top: 20px;
            padding: 10px;
        }

    </style>
</head>
<body>

    <h2>Community Event Promo Video</h2>

    <!-- Video -->
    <video
        controls
        oncanplay="videoReady()"
    >

        <source src="promo.mp4" type="video/mp4">

        Your browser does not support video.

    </video>

    <p id="message"></p>

    <br>

    <!-- Form Content -->
    <textarea
        id="feedback"
        placeholder="Enter feedback before leaving page..."
    ></textarea>

    <script>

        // Video Ready Message
        function videoReady() {

            document.getElementById("message")
                .innerHTML =
                "Video ready to play";

        }

        // Warn Before Leaving Page
        window.onbeforeunload = function() {

            let text =
                document.getElementById("feedback").value;

            if(text !== "") {

                return "You have unsaved changes.";

            }

        };

    </script>

</body>
</html>
