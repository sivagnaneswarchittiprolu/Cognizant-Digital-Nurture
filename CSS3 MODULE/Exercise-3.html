<!-- # 3. Selectors Playground -->

<!DOCTYPE html>
<html>
<head>
    <title>Selectors Playground</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h2{
            color: darkblue;
            margin-bottom: 10px;
        }

        #mainHeader{
            background-color: orange;
            color: white;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .eventCard{
            background-color: white;
            border: 2px solid gray;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        h3, p{
            color: #333;
            font-family: Verdana, sans-serif;
        }

    </style>

</head>
<body>

    <div id="mainHeader">
        <h1>Local Community Event Portal</h1>
    </div>

    <div class="eventCard">
        <h2>Music Concert</h2>
        <h3>Live Performance</h3>
        <p>Enjoy an amazing evening with live music and food stalls.</p>
    </div>

    <div class="eventCard">
        <h2>Art Workshop</h2>
        <h3>Creative Session</h3>
        <p>Join local artists and learn creative painting techniques.</p>
    </div>

</body>
</html>
