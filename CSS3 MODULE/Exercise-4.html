<!-- # 4. Color & Background Styling -->

<!DOCTYPE html>
<html>
<head>
    <title>Color and Background Styling</title>

    <style>

        body{
            background-color: #f0f0f0;
            background-image: url("background.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1{
            color: #FF5733;
            text-align: center;
            margin-bottom: 20px;
        }

        .sectionHeader{
            background: linear-gradient(to right, blue, purple);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .eventCard{
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        p{
            color: #222;
            line-height: 1.6;
        }

    </style>

</head>
<body>

    <h1>Local Community Event Portal</h1>

    <div class="sectionHeader">
        <h2>Upcoming Events</h2>
    </div>

    <div class="eventCard">
        <h3>Food Festival</h3>
        <p>
            Enjoy delicious local foods, live music,
            and exciting activities for all age groups.
        </p>
    </div>

    <div class="eventCard">
        <h3>City Marathon</h3>
        <p>
            Participate in the annual city marathon and
            promote fitness and healthy living.
        </p>
    </div>

</body>
</html>
