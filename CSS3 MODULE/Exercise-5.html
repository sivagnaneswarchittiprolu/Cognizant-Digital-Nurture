<!-- # 5. Typography: Fonts and Text -->

<!DOCTYPE html>
<html>
<head>
    <title>Typography Fonts and Text</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>

        body{
            font-family: 'Poppins', sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
            line-height: 1.8;
        }

        h1{
            font-size: 36px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            color: darkblue;
        }

        h2{
            font-size: 28px;
            font-style: italic;
            color: #444;
        }

        .description{
            font-size: 18px;
            font-weight: 400;
            text-align: justify;
            line-height: 1.7;
            letter-spacing: 1px;
            color: #333;
        }

        .eventCard{
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

    </style>

</head>
<body>

    <h1>Community Event Portal</h1>

    <div class="eventCard">

        <h2>Summer Cultural Fest</h2>

        <p class="description">
            The Summer Cultural Fest brings together music,
            dance, food, and entertainment for the entire community.
            Enjoy exciting performances and interactive activities.
        </p>

    </div>

</body>
</html>
