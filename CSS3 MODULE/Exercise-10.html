<!-- # 10. Responsive Web Design with Media Queries -->

<!DOCTYPE html>
<html>
<head>
    <title>Responsive Web Design</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header{
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav ul{
            display: flex;
            justify-content: center;
            list-style: none;
            background-color: #333;
            margin: 0;
            padding: 10px;
        }

        nav ul li{
            margin: 0 15px;
        }

        nav ul li a{
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container{
            width: 80%;
            margin: auto;
            padding: 20px;
        }

        .eventCard{
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        img{
            width: 50%;
            height: auto;
            border-radius: 10px;
        }

        @media screen and (max-width:768px){

            nav ul{
                flex-direction: column;
                align-items: center;
            }

            nav ul li{
                margin: 10px 0;
            }

            img{
                width: 100%;
            }

            body{
                font-size: 14px;
            }

            .container{
                width: 95%;
            }
        }

    </style>

</head>
<body>

    <header>
        <h1>Community Event Portal</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Events</a></li>
            <li><a href="#">Gallery</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <div class="container">

        <div class="eventCard">

            <h2>Music Festival</h2>

            <img src="event.jpg" alt="Event Image">

            <p>
                Enjoy live music performances, delicious food,
                and exciting entertainment activities.
            </p>

        </div>

    </div>

</body>
</html>
