<!-- # 2. CSS Syntax and Comments -->

<!DOCTYPE html>
<html>
<head>
    <title>CSS Syntax and Comments</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
        }

        h1{
            color: darkblue;
            text-align: center;
        }

        .cta-button{
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        p{
            font-size: 18px;
            line-height: 1.5;
            color: #333;
        }

    </style>

</head>
<body>

    <h1>Community Event Portal</h1>

    <p>
        Welcome to the local community portal. Explore events,
        workshops, and activities happening near you.
    </p>

    <button class="cta-button">Register Now</button>

</body>
</html>
