<!-- # 7. Table Styling -->

<!DOCTYPE html>
<html>
<head>
    <title>Table Styling</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1{
            text-align: center;
            color: darkblue;
            margin-bottom: 20px;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            background-color: white;
        }

        th, td{
            border: 1px solid black;
            padding: 12px;
        }

        th{
            background-color: #007BFF;
            color: white;
        }

        tr:nth-child(even){
            background-color: #f2f2f2;
        }

        tr:hover{
            background-color: #ddd;
        }

    </style>

</head>
<body>

    <h1>Community Event Schedule</h1>

    <table>

        <tr>
            <th>Event Name</th>
            <th>Date</th>
            <th>Location</th>
        </tr>

        <tr>
            <td>Music Concert</td>
            <td>10 June 2026</td>
            <td>City Hall</td>
        </tr>

        <tr>
            <td>Food Festival</td>
            <td>15 June 2026</td>
            <td>Community Park</td>
        </tr>

        <tr>
            <td>Art Exhibition</td>
            <td>20 June 2026</td>
            <td>Art Gallery</td>
        </tr>

    </table>

</body>
</html>
